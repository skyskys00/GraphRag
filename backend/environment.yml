# GraphRAG 练手项目环境基准（与 P1 落地验证过的版本组合一致）
# 用法：conda env create -f environment.yml
#
# 版本配对坑（详见 p1.md §8「P1 落地记录」）：
#   - mineru 要求 transformers>=4.57.3,<5.0.0（5.x 移除了旧 API find_pruneable_heads_and_indices）
#   - sentence-transformers 6.x 要求 transformers>=5，若装会毁掉 mineru → 双双锁 4.x
#   - mineru 主包默认不装齐解析依赖，需显式补 torchvision/shapely/pyclipper/ftfy/opencv

name: graphrag
dependencies:
  - python=3.11
  - pip
  - pip:
      - lightrag-hku
      # ---- R 切块（标题感知，P2.1 起使用）----
      - langchain-text-splitters
      # ---- Agent 编排（M10，P0 探底通过 2026-10-23，见 CHANGELOG v5.41）----
      - langgraph==1.2.16   # 依赖树自带 langchain-core，不装全量 langchain
      - langgraph-checkpoint-postgres==3.2.0   # M10 checkpointer（v6.4）
      - psycopg[binary]==3.3.6                 # 上面的 PG saver 驱动（v3，勿装 psycopg2）
      - psycopg-pool==3.3.3
      # ---- 解析引擎 ----
      - mineru
      - docling               # docx/pptx/xlsx/html/epub 兜底（PDF 一律走 MinerU）
      # ---- MinerU pipeline extras ----
      - torch==2.14.0
      - torchvision==0.29.0
      - shapely
      - pyclipper
      - ftfy
      - opencv-python
      # ---- 版本配对（坑） ----
      - transformers==4.57.6
      - sentence-transformers==4.1.0